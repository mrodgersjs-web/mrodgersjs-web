criteria:
  - id: 'profile-readme-exists'
    check: 'gh'
    target: 'mrodgersjs-web/mrodgersjs-web README.md'
    pass_rule: 'Contents API returns README.md'
    description: 'mrodgersjs-web/mrodgersjs-web has README.md'
  - id: 'banner-200'
    check: 'http'
    target: 'assets/profile-banner-v2.jpg on raw.githubusercontent.com'
    pass_rule: 'HTTP status is 200'
    description: 'assets/profile-banner-v2.jpg raw.githubusercontent.com HTTP 200'
  - id: 'no-phone'
    check: 'regex'
    target: 'profile README'
    pass_rule: 'No phone-number regex match'
    description: 'profile README has no match of `\d{3}[.\-\s]?\d{3}[.\-\s]?\d{4}`'
  - id: 'contact-email'
    check: 'regex'
    target: 'profile README'
    pass_rule: 'Contains mrodgersjs@gmail.com'
    description: 'README contains `mrodgersjs@gmail.com`'
  - id: 'bio-fde'
    check: 'gh'
    target: 'authenticated GitHub user bio'
    pass_rule: 'Bio contains Forward Deployed Engineer'
    description: '`gh api user --jq .bio` contains `Forward Deployed Engineer`'
  - id: 'blog-url'
    check: 'gh'
    target: 'authenticated GitHub user.blog'
    pass_rule: 'Equals rodgersintelligence.com URL with optional trailing slash'
    description: 'user.blog is `https://rodgersintelligence.com/` or with trailing slash'
  - id: 'location-denver'
    check: 'gh'
    target: 'authenticated GitHub user.location'
    pass_rule: 'Contains Denver'
    description: 'user.location contains `Denver`'
  - id: 'hireable'
    check: 'gh'
    target: 'authenticated GitHub user.hireable'
    pass_rule: 'Value is true'
    description: 'user.hireable is true'
  - id: 'linkedin-social'
    check: 'gh'
    target: 'user/social_accounts'
    pass_rule: 'Includes the approved LinkedIn URL'
    description: '`user/social_accounts` includes the LinkedIn URL above'
  - id: 'pins-six'
    check: 'gh'
    target: 'profile pinnedItems and steward/PINNED.txt'
    pass_rule: 'Names match all six pins in file order'
    description: 'GraphQL pinnedItems names == the six in `steward/PINNED.txt` (one name per line)'
  - id: 'following-20'
    check: 'gh'
    target: 'authenticated GitHub following count'
    pass_rule: 'Count is at least 20'
    description: 'following count ≥ 20'
  - id: 'live-repo-count'
    check: 'gh'
    target: 'profile README and public repository inventory'
    pass_rule: 'No static count differs from live public length'
    description: 'README does not contain a repo count that differs from `gh repo list --json isPrivate` public length'
  - id: 'public-cap'
    check: 'gh'
    target: 'public repository inventory'
    pass_rule: 'Count is at most 30'
    description: 'public repo count ≤ 30'
  - id: 'every-desc'
    check: 'gh'
    target: 'all public repository descriptions'
    pass_rule: 'Every description is nonempty'
    description: 'no public repo with empty description'
  - id: 'every-license'
    check: 'gh'
    target: 'LICENSE in every public repository'
    pass_rule: 'Contents API finds LICENSE for every repository'
    description: 'every public repo has a LICENSE file (Contents API)'
  - id: 'no-empty-stub'
    check: 'gh'
    target: 'every public repository tree'
    pass_rule: 'README.md and one non-asset file both exist'
    description: 'every public repo has README.md and at least one non-asset file'
  - id: 'birch-private'
    check: 'gh'
    target: 'birch-rig-boots'
    pass_rule: 'Repository is private or API returns 404'
    description: 'birch-rig-boots isPrivate true or 404'
  - id: 'openwork-private'
    check: 'gh'
    target: 'openwork'
    pass_rule: 'Repository is private or API returns 404'
    description: 'openwork isPrivate true or 404'
  - id: 'omniscout-private'
    check: 'gh'
    target: 'rig-omniscout-l2'
    pass_rule: 'Repository is private or API returns 404'
    description: 'rig-omniscout-l2 isPrivate true or 404'
  - id: 'legacy-site-private'
    check: 'gh'
    target: 'mike-rodgers-site'
    pass_rule: 'Repository is private or API returns 404'
    description: 'mike-rodgers-site isPrivate true or 404'
  - id: 'no-abs-home-paths'
    check: 'gh'
    target: 'public default-branch trees'
    pass_rule: 'No forbidden absolute home path outside documented exclusions'
    description: 'grep public default-branch trees for `/Users/rig128gb` and `/home/operator` returns empty (skip LICENSE/docs quoting the steward itself)'
  - id: 'no-pycache'
    check: 'gh'
    target: 'public repository trees'
    pass_rule: 'No __pycache__ path exists'
    description: 'no `__pycache__` in public trees'
  - id: 'no-env-files'
    check: 'gh'
    target: 'public repository trees'
    pass_rule: 'No .env, .pem, or id_rsa path exists'
    description: 'no `.env`, `.pem`, `id_rsa` in public trees'
  - id: 'flagship-homepage'
    check: 'gh'
    target: 'rigforge, proof-studio, and fde-portfolio homepage'
    pass_rule: 'Each is rodgersintelligence.com or a nonempty docs URL'
    description: 'rigforge, proof-studio, fde-portfolio homepage is rodgersintelligence.com or a docs URL (not empty)'
  - id: 'topics-baseline'
    check: 'gh'
    target: 'topics on every public repository'
    pass_rule: 'All seven baseline topics are present'
    description: 'every public repo topics include the 7 baseline'
  - id: 'topics-specific'
    check: 'gh'
    target: 'topics on every public repository'
    pass_rule: 'At least 10 topics, including three specific topics'
    description: 'every public repo has ≥10 topics (7 baseline + ≥3 specific)'
  - id: 'desc-no-typo'
    check: 'gh'
    target: 'public repository descriptions'
    pass_rule: 'No description contains ProofPates'
    description: 'no public description contains `ProofPates`'
  - id: 'default-main'
    check: 'gh'
    target: 'default branch of every public repository'
    pass_rule: 'Every default_branch equals main'
    description: 'default_branch is `main` on every public repo'
  - id: 'clone-org'
    check: 'gh'
    target: 'public README files'
    pass_rule: 'No legacy GitHub organization clone URL occurs'
    description: 'no public README contains `github.com/rodgemd1-lgtm` or `github.com/rig-intelligence/`'
  - id: 'unique-desc'
    check: 'gh'
    target: 'public repository descriptions'
    pass_rule: 'Every nonempty description string is unique'
    description: 'no two public repos share an identical description string'
  - id: 'readme-exists'
    check: 'gh'
    target: 'README.md in every public repository'
    pass_rule: 'Contents API finds README.md for every repository'
    description: 'every public repo has README.md'
  - id: 'install-first'
    check: 'regex'
    target: 'first 80 lines of every public README'
    pass_rule: 'Contains a fenced code block'
    description: 'README contains a fenced code block in the first 80 lines'
  - id: 'how-it-works-visual'
    check: 'llm'
    target: 'every public README'
    pass_rule: 'References an assets image or SVG that explains the system'
    description: 'README references `assets/` image or svg'
  - id: 'live-ci-badge'
    check: 'regex'
    target: 'README files for repositories with workflows'
    pass_rule: 'Badge URL contains github/actions/workflow/status'
    description: 'if `.github/workflows` exists, README badge URL contains `github/actions/workflow/status`'
  - id: 'license-badge-match'
    check: 'gh'
    target: 'public README and LICENSE pairs'
    pass_rule: 'Every README claiming MIT has a LICENSE file'
    description: 'if README says MIT, LICENSE file exists'
  - id: 'install-registry'
    check: 'http'
    target: 'unqualified pip and npx install claims'
    pass_rule: 'Named PyPI or npm registry endpoint returns 200'
    description: 'if README has `pip install <name>` without `git+`, pypi.org/pypi/<name>/json is 200; same for `npx <name>` vs registry.npmjs.org'
  - id: 'test-count-honest'
    check: 'gh'
    target: 'test-count badges and latest workflows'
    pass_rule: 'Any N/N tests badge is backed by a successful latest workflow'
    description: 'no `N/N tests` badge unless latest workflow conclusion is success'
  - id: 'footer-site'
    check: 'regex'
    target: 'every public README'
    pass_rule: 'Contains rodgersintelligence.com'
    description: 'README contains `rodgersintelligence.com`'
  - id: 'no-raw-json-tables'
    check: 'regex'
    target: 'every public README'
    pass_rule: 'No table line matches either raw JSON pattern'
    description: 'README has no line matching `^\|.*\{&quot;|^\\|.*\{"`'
  - id: 'verify-command'
    check: 'regex'
    target: 'every public README'
    pass_rule: 'Contains at least one approved verification command token'
    description: 'README contains `pytest` or `smoke` or `npm test` or `node --test` or `rigforge`'
  - id: 'hero-ok'
    check: 'http'
    target: 'referenced local README images'
    pass_rule: 'Every referenced local image returns HTTP 200'
    description: 'referenced local images HTTP 200'
  - id: 'no-false-e2e'
    check: 'llm'
    target: 'public README e2e claims and workflow names'
    pass_rule: 'Any e2e claim is supported by an e2e or smoke workflow name'
    description: 'README does not contain `e2e` unless a workflow file name contains `e2e` or `smoke`'
  - id: 'readme-size'
    check: 'gh'
    target: 'every public README.md'
    pass_rule: 'Byte size is at most 40000'
    description: 'README.md ≤ 40000 bytes'
  - id: 'clone-url-self'
    check: 'regex'
    target: 'clone examples in every public README'
    pass_rule: 'Clone owner and repository match the current repository'
    description: 'clone examples use `mrodgersjs-web/<this-repo>`'
  - id: 'languages-honest'
    check: 'gh'
    target: 'README language shields and Linguist language data'
    pass_rule: 'Shield languages are a subset of Linguist languages'
    description: 'language shields in README ⊆ linguist languages for that repo'
  - id: 'details-collapse'
    check: 'llm'
    target: 'public READMEs longer than 250 lines'
    pass_rule: 'Long README contains a details disclosure block'
    description: 'READMEs longer than 250 lines contain `<details>`'
  - id: 'insight-quote'
    check: 'regex'
    target: 'profile README'
    pass_rule: 'Contains a Markdown blockquote'
    description: 'profile README contains a blockquote'
  - id: 'no-secret-clearance-string'
    check: 'regex'
    target: 'profile README'
    pass_rule: 'Does not contain Secret Security Clearance'
    description: 'profile README does not contain `Secret Security Clearance`'
  - id: 'product-has-workflow'
    check: 'gh'
    target: 'six pinned repositories'
    pass_rule: 'Each has at least one Actions workflow'
    description: 'the 6 pins each have ≥1 Actions workflow'
  - id: 'latest-success'
    check: 'gh'
    target: 'latest run on each pinned repository'
    pass_rule: 'Every conclusion is success'
    description: 'latest run conclusion on each pin is `success`'
  - id: 'proof-gate-ci'
    check: 'gh'
    target: 'proof-gate-action workflow runs'
    pass_rule: 'A successful run exists in the last 14 days'
    description: 'proof-gate-action has a successful run in last 14 days'
  - id: 'mesh-green'
    check: 'gh'
    target: 'mesh-studio ci.yml latest run'
    pass_rule: 'Conclusion is success'
    description: 'mesh-studio latest ci.yml success'
  - id: 'jake-green'
    check: 'gh'
    target: 'jake-studio smoke.yml latest run'
    pass_rule: 'Conclusion is success'
    description: 'jake-studio latest smoke.yml success'
  - id: 'comms-green'
    check: 'gh'
    target: 'communications-studio ci.yml latest run'
    pass_rule: 'Conclusion is success'
    description: 'communications-studio latest ci.yml success'
  - id: 'deviatrix-green-or-unclaimed'
    check: 'gh'
    target: 'deviatrix-genesis CI and README'
    pass_rule: 'Latest CI succeeds or README makes no MCP claim'
    description: 'either latest ci success or README does not say MCP'
  - id: 'resume-green'
    check: 'gh'
    target: 'resume smoke latest run'
    pass_rule: 'Conclusion is success'
    description: 'resume latest smoke success'
  - id: 'patents-green'
    check: 'gh'
    target: 'patents smoke latest run'
    pass_rule: 'Conclusion is success'
    description: 'patents latest smoke success'
  - id: 'no-continue-on-error'
    check: 'gh'
    target: 'pinned repository workflows'
    pass_rule: 'No workflow contains continue-on-error true'
    description: 'pin workflows do not contain `continue-on-error: true`'
  - id: 'workflow-on-default'
    check: 'gh'
    target: 'Actions workflows on each pinned repository'
    pass_rule: 'At least one non-Dependabot workflow is on the default branch'
    description: 'Actions API total_count for non-dependabot workflows ≥1 on each pin'
  - id: 'dependabot-rigforge'
    check: 'gh'
    target: 'rigforge .github/dependabot.yml'
    pass_rule: 'File exists'
    description: 'rigforge has `.github/dependabot.yml`'
  - id: 'proof-gate-tag'
    check: 'gh'
    target: 'proof-gate-action tags and workflow history'
    pass_rule: 'Tag v1 exists after the first green run'
    description: 'proof-gate-action has git tag `v1` after first green'
  - id: 'no-skipped-jobs-as-pass'
    check: 'gh'
    target: 'jobs in latest pinned runs'
    pass_rule: 'Required smoke job succeeds and is not skipped'
    description: 'latest run jobs all conclusion success or skipped=0 for required smoke job'
  - id: 'planted-failure-docs'
    check: 'llm'
    target: 'rigforge README'
    pass_rule: 'Mentions planted failure or ProofPacket'
    description: 'rigforge README mentions planted failure or ProofPacket'
  - id: 'action-yml-valid'
    check: 'gh'
    target: 'proof-gate-action root'
    pass_rule: 'action.yml or action.yaml exists'
    description: 'proof-gate-action has `action.yml` or `action.yaml`'
  - id: 'public-mcp-count'
    check: 'gh'
    target: 'profile README and public repository trees'
    pass_rule: 'Displayed count equals the live matching repository count'
    description: 'profile README MCP server count == number of repos whose tree contains a file matching `mcp_server.py` or `stdio_server` under the repo (recompute live)'
  - id: 'rigforge-mcp-file'
    check: 'gh'
    target: 'rigforge/rigforge/mcp_server.py'
    pass_rule: 'File exists'
    description: '`rigforge/mcp_server.py` exists'
  - id: 'mesh-mcp-file'
    check: 'gh'
    target: 'mesh-studio/src/rig_mesh/mcp_server.py'
    pass_rule: 'File exists'
    description: '`src/rig_mesh/mcp_server.py` exists'
  - id: 'catalog-mcp-file'
    check: 'gh'
    target: 'profile steward/catalog_mcp.py'
    pass_rule: 'File exists'
    description: 'profile repo `steward/catalog_mcp.py` exists'
  - id: 'comms-not-mcp'
    check: 'regex'
    target: 'communications-studio README'
    pass_rule: 'Does not describe itself as an MCP server'
    description: 'communications-studio README does not call itself an MCP server'
  - id: 'omniscout-not-public-mcp'
    check: 'gh'
    target: 'rig-omniscout-l2 visibility'
    pass_rule: 'Repository is not public'
    description: 'rig-omniscout-l2 not public'
  - id: 'claude-desktop-snippet'
    check: 'regex'
    target: 'rigforge README'
    pass_rule: 'Contains the mcpServers JSON key'
    description: 'rigforge README contains `"mcpServers"`'
  - id: 'catalog-readonly'
    check: 'regex'
    target: 'profile steward/catalog_mcp.py'
    pass_rule: 'Contains no mutating gh api method invocation'
    description: 'catalog_mcp.py contains no `gh api -X POST` / `PATCH` / `PUT` / `DELETE`'
  - id: 'catalog-evals'
    check: 'file'
    target: 'profile steward/evals.xml'
    pass_rule: 'Contains exactly 10 eval elements'
    description: 'profile `steward/evals.xml` has 10 `<eval` tags'
  - id: 'local-57-unadvertised'
    check: 'regex'
    target: 'all public README files'
    pass_rule: 'Contains neither forbidden local adapter claim'
    description: 'no public README contains `github-repo-mcp` or `228 tools`'
  - id: 'no-public-mcp-port'
    check: 'regex'
    target: 'profile steward/catalog_mcp.py'
    pass_rule: 'Runtime transport is stdio only'
    description: 'catalog_mcp.py run transport is stdio only'
  - id: 'mcp-no-plaintext-tokens'
    check: 'regex'
    target: 'public MCP README snippets'
    pass_rule: 'Uses environment reference or gh auth and contains no ghp token'
    description: 'MCP README snippets use `${env:GH_TOKEN}` or `gh auth` not `ghp_`'
  - id: 'copilot-instructions-pins'
    check: 'gh'
    target: 'six pinned repositories .github/copilot-instructions.md'
    pass_rule: 'File exists on every pin'
    description: 'each of 6 pins has `.github/copilot-instructions.md`'
  - id: 'copilot-instructions-profile'
    check: 'gh'
    target: 'profile .github/copilot-instructions.md'
    pass_rule: 'File exists'
    description: 'profile repo has `.github/copilot-instructions.md`'
  - id: 'agents-md-pins'
    check: 'gh'
    target: 'six pinned repository AGENTS.md files'
    pass_rule: 'File exists on every pin'
    description: 'each pin has `AGENTS.md`'
  - id: 'copilot-file-short'
    check: 'gh'
    target: 'all pin .github/copilot-instructions.md files'
    pass_rule: 'Every file is at most 8000 bytes'
    description: 'each copilot-instructions.md ≤ 8000 bytes'
  - id: 'copilot-has-test-cmd'
    check: 'regex'
    target: 'all pin .github/copilot-instructions.md files'
    pass_rule: 'Each contains pytest, smoke, or npm test'
    description: 'each copilot-instructions.md contains the word `pytest` or `smoke` or `npm test`'
  - id: 'codeowners-pins'
    check: 'gh'
    target: 'six pinned repository .github/CODEOWNERS files'
    pass_rule: 'Each contains @mrodgersjs-web'
    description: 'each pin has `.github/CODEOWNERS` containing `@mrodgersjs-web`'
  - id: 'pin-narrative'
    check: 'llm'
    target: 'profile steward/PINNED.txt'
    pass_rule: 'Order matches the six approved repositories or a documented unexpired stand-in'
    description: 'PINNED.txt order is rigforge, proof-studio, proof-gate-action, mesh-studio, doctrine, fde-portfolio (or evals stand-in documented in PINNED.txt with expiry date)'
  - id: 'resume-pdf'
    check: 'http'
    target: 'mrodgersjs-web/resume PDF or README link'
    pass_rule: 'PDF exists or linked PDF returns HTTP 200'
    description: '`mrodgersjs-web/resume` contains a `.pdf` or README link that HTTP 200s'
  - id: 'directory-matches-public'
    check: 'gh'
    target: 'rig-agent-directory and live public inventory'
    pass_rule: 'If public, listed count equals live count'
    description: 'if `rig-agent-directory` is public, its listed repo count equals live public count'
  - id: 'no-star-farming'
    check: 'gh'
    target: 'stargazerCount on owned repositories'
    pass_rule: 'No self-stars are added; zero is acceptable'
    description: 'do not star own repos; stargazerCount on own repos may stay 0'
  - id: 'activity-7d'
    check: 'gh'
    target: 'profile repository pushes and Actions activity'
    pass_rule: 'At least one event occurred in the last seven days'
    description: 'at least one public push or Action on profile repo in last 7 days'
  - id: 'contact-path'
    check: 'regex'
    target: 'profile README'
    pass_rule: 'Contains LinkedIn, website, and email'
    description: 'profile README has LinkedIn and site and email'
  - id: 'fde-portfolio-smoke'
    check: 'gh'
    target: 'fde-portfolio latest smoke run'
    pass_rule: 'Conclusion is success'
    description: 'fde-portfolio latest smoke success'
  - id: 'no-clearance-overclaim'
    check: 'regex'
    target: 'profile README'
    pass_rule: 'Does not contain active vetting'
    description: 'profile README does not contain `active vetting`'
  - id: 'criteria-count'
    check: 'file'
    target: 'steward/criteria.yaml'
    pass_rule: 'Contains exactly 100 id keys'
    description: 'criteria.yaml has exactly 100 `id:` keys'
  - id: 'today-scoreboard'
    check: 'file'
    target: 'steward/scoreboard/$(date -u +%F).json'
    pass_rule: 'File exists after the daily run'
    description: '`steward/scoreboard/$(date -u +%F).json` exists after the daily run'
  - id: 'latest-pointer'
    check: 'file'
    target: 'steward/scoreboard/latest.json'
    pass_rule: 'File exists'
    description: '`steward/scoreboard/latest.json` exists'
  - id: 'scoreboard-hash'
    check: 'file'
    target: 'steward/scoreboard/latest.json and steward/criteria.yaml'
    pass_rule: 'latest criteria_sha256 equals the criteria.yaml SHA-256'
    description: 'latest.json includes `sha256` of criteria.yaml'
  - id: 'orca-automation'
    check: 'file'
    target: 'orca automations list --json'
    pass_rule: 'GitHub FDE steward exists and enabled is true'
    description: '`orca automations list --json` contains name `GitHub FDE steward` and `enabled: true`'
  - id: 'local-first'
    check: 'file'
    target: 'steward/judge.py'
    pass_rule: 'Contains FALLBACK_PAID and probes ollama list first'
    description: 'judge.py contains the string `FALLBACK_PAID` and calls `ollama list` before any other model'
  - id: 'issues-for-reds'
    check: 'gh'
    target: 'latest scoreboard reds and github-steward issues'
    pass_rule: 'Each prior-day red has an open labeled issue'
    description: 'when latest.red > 0, an open issue labeled `github-steward` exists (checked the day after Orca run)'
  - id: 'readme-receipts-fresh'
    check: 'regex'
    target: 'profile README recent_receipts block'
    pass_rule: 'Receipt date is at least yesterday UTC'
    description: 'profile README `recent_receipts` block date ≥ yesterday UTC'
  - id: 'no-direct-main-from-orca'
    check: 'file'
    target: 'ORCA_PROMPT.md'
    pass_rule: 'Contains Do not git push to main'
    description: 'ORCA_PROMPT.md contains `Do not git push to main`'
  - id: 'planted-failure'
    check: 'file'
    target: 'steward/score_github.py --plant missing-license'
    pass_rule: 'Plant run exits zero with criterion 15 red; restored run is green when licenses exist'
    description: '`python3 steward/score_github.py --plant missing-license` exits 0 and JSON has criterion 15 red; running without `--plant` after restore is green on 15 if LICENSE exists'
