<text x="940" y="56" font-size="28" fill="#1e1e1e" text-anchor="middle"><tspan x="940" dy="0">KNOWLEDGE PIPELINE — corpus to GROUND</tspan></text>
<text x="940" y="94" font-size="16" fill="#495057" text-anchor="middle"><tspan x="940" dy="0">corpus(853) + ytsearch(12 domains) → scrape → raw transcripts → distill(swarm) → knowledge/ cards → phase 05 GROUND</tspan></text>
<rect x="70" y="150" width="380" height="130" rx="10" fill="#d0ebff" fill-opacity="1.00" stroke="#1971c2" stroke-width="2"/>
<text x="260" y="183" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="260" dy="0">RECALL CORPUS</tspan></text>
<text x="260" y="212" font-size="16" fill="#495057" text-anchor="middle"><tspan x="260" dy="0">853 tagged cards · 17-tag vocabulary</tspan></text>
<text x="260" y="240" font-size="16" fill="#495057" text-anchor="middle"><tspan x="260" dy="0">data/card-index.json</tspan></text>
<rect x="70" y="430" width="380" height="130" rx="10" fill="#d0ebff" fill-opacity="1.00" stroke="#1971c2" stroke-width="2"/>
<text x="260" y="463" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="260" dy="0">YTSEARCH SWEEPS</tspan></text>
<text x="260" y="492" font-size="16" fill="#495057" text-anchor="middle"><tspan x="260" dy="0">yt-dlp ytsearch · 12 polymath domains</tspan></text>
<text x="260" y="520" font-size="16" fill="#495057" text-anchor="middle"><tspan x="260" dy="0">Meadows · Senge · Ackoff · Goldratt</tspan></text>
