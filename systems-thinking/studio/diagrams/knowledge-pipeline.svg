<text x="730" y="212" font-size="16" fill="#495057" text-anchor="middle"><tspan x="730" dy="0">scripts/studio_scrape_youtube.py</tspan></text>
<text x="730" y="240" font-size="16" fill="#495057" text-anchor="middle"><tspan x="730" dy="0">enumerate → fetch auto-captions</tspan></text>
<text x="730" y="268" font-size="16" fill="#495057" text-anchor="middle"><tspan x="730" dy="0">dedup · scrape-manifest.jsonl</tspan></text>
<rect x="540" y="430" width="380" height="130" rx="10" fill="#e7f5ff" fill-opacity="1.00" stroke="#1971c2" stroke-width="2"/>
<text x="730" y="463" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="730" dy="0">RAW TRANSCRIPTS</tspan></text>
<text x="730" y="492" font-size="16" fill="#495057" text-anchor="middle"><tspan x="730" dy="0">knowledge/youtube/raw/&lt;id&gt;.txt</tspan></text>
<text x="730" y="520" font-size="16" fill="#495057" text-anchor="middle"><tspan x="730" dy="0">VTT → timestamped text (provenance)</tspan></text>
<rect x="1010" y="150" width="380" height="130" rx="10" fill="#e7f5ff" fill-opacity="1.00" stroke="#1971c2" stroke-width="2"/>
<text x="1200" y="183" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="1200" dy="0">DISTILL (swarm)</tspan></text>
<text x="1200" y="212" font-size="16" fill="#495057" text-anchor="middle"><tspan x="1200" dy="0">per-video distillation → cards</tspan></text>
<text x="1200" y="240" font-size="16" fill="#495057" text-anchor="middle"><tspan x="1200" dy="0">## Procedure / models + timestamps</tspan></text>
<rect x="1010" y="430" width="380" height="130" rx="10" fill="#d0ebff" fill-opacity="1.00" stroke="#1971c2" stroke-width="2"/>
<text x="1200" y="463" font-size="20" fill="#1e1e1e" text-anchor="middle"><tspan x="1200" dy="0">KNOWLEDGE CARDS</tspan></text>
<text x="1200" y="492" font-size="16" fill="#495057" text-anchor="middle"><tspan x="1200" dy="0">knowledge/{youtube,papers,books}</tspan></text>
<text x="1200" y="520" font-size="16" fill="#495057" text-anchor="middle"><tspan x="1200" dy="0">manifests mounted as harness --input</tspan></text>
<rect x="1460" y="260" width="360" height="170" rx="10" fill="#a5d8ff" fill-opacity="1.00" stroke="#1971c2" stroke-width="3"/>
