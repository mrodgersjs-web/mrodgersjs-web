<text x="940" y="646" font-size="16" fill="#495057" text-anchor="middle"><tspan x="940" dy="0">edges: corpus contributes every youtube URL · ytsearch sweeps 6 queries/domain · scrape = auto-captions + dedup · distill keeps raw for provenance</tspan></text>
<text x="940" y="686" font-size="16" fill="#495057" text-anchor="middle"><tspan x="940" dy="0">first pass: 20 cards scraped OK (12 from corpus + 8 canon) · hard cap 20 reached · distillation is a separate step (studio_distill.py)</tspan></text>
