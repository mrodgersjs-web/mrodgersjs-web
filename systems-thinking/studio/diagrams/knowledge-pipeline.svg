<text x="1640" y="332" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1640" dy="0">citations: [Card: title](url)</tspan></text>
<text x="1640" y="360" font-size="16" fill="#495057" text-anchor="middle"><tspan x="1640" dy="0">## Gaps — absent evidence is a finding</tspan></text>
<text x="1640" y="388" font-size="16" fill="#495057" text-anchor="middle"><tspan x="1640" dy="0">feeds 07 SYNTHESIZE → 08 VERIFY</tspan></text>
