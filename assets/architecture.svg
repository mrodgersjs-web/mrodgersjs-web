ersuasion</text><text x="1156" y="386" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="10.5" letter-spacing="0.4" fill="#A09890">ATTENTION → ACTION</text></svg>