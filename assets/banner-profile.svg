<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Mike Rodgers — Forward Deployed Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0806"/>
      <stop offset="55%" stop-color="#12100D"/>
      <stop offset="100%" stop-color="#1A1712"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A96E"/>
      <stop offset="100%" stop-color="#E8D5A8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Subtle top accent line -->
  <line x1="80" y1="60" x2="1120" y2="60" stroke="#C8A96E" stroke-width="1" opacity="0.35"/>

  <!-- Architecture motif: gates → proof flow -->
  <g transform="translate(80, 260)" opacity="0.9">
    <!-- Gate 1 -->
    <rect x="0" y="0" width="56" height="72" rx="4" fill="none" stroke="#C8A96E" stroke-width="2"/>
    <rect x="8" y="8" width="40" height="56" rx="2" fill="none" stroke="#C8A96E" stroke-width="1" opacity="0.5"/>
    <text x="28" y="42" text-anchor="middle" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10" font-weight="600">BUILD</text>

    <!-- Arrow -->
    <line x1="66" y1="36" x2="110" y2="36" stroke="#C8A96E" stroke-width="2" opacity="0.7"/>
    <polygon points="110,36 102,32 102,40" fill="#C8A96E" opacity="0.7"/>

    <!-- Gate 2 / Proof Packet -->
    <rect x="120" y="0" width="104" height="72" rx="4" fill="#C8A96E" opacity="0.08"/>
    <rect x="120" y="0" width="104" height="72" rx="4" fill="none" stroke="#C8A96E" stroke-width="2"/>
    <text x="172" y="30" text-anchor="middle" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10" font-weight="600">PROOF</text>
    <text x="172" y="48" text-anchor="middle" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10" font-weight="600">PACKET</text>

    <!-- Arrow -->
    <line x1="234" y1="36" x2="278" y2="36" stroke="#C8A96E" stroke-width="2" opacity="0.7"/>
    <polygon points="278,36 270,32 270,40" fill="#C8A96E" opacity="0.7"/>

    <!-- Gate 3 / Verify -->
    <rect x="288" y="0" width="72" height="72" rx="4" fill="none" stroke="#C8A96E" stroke-width="2"/>
    <circle cx="324" cy="36" r="16" fill="none" stroke="#C8A96E" stroke-width="2"/>
    <path d="M316 36 L322 44 L334 28" fill="none" stroke="#C8A96E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="324" y="92" text-anchor="middle" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10" font-weight="600" opacity="0.8">GATE PASSED</text>
  </g>

  <!-- Main title -->
  <text x="80" y="170" fill="#F4F1EA" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="400" letter-spacing="-1">Mike Rodgers</text>

  <!-- Subtitle -->
  <text x="82" y="215" fill="#C8A96E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="2">FORWARD DEPLOYED ENGINEER</text>

  <!-- URL -->
  <text x="1120" y="360" text-anchor="end" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="14" letter-spacing="1">rodgersintelligence.com</text>

  <!-- Corner hash decoration -->
  <text x="1120" y="92" text-anchor="end" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11" opacity="0.45">A1B2C3D4 • HMAC-SHA256</text>

  <!-- Thin bottom rule -->
  <line x1="80" y1="380" x2="1120" y2="380" stroke="#C8A96E" stroke-width="1" opacity="0.2"/>
</svg>