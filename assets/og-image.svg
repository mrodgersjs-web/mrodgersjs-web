<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mike Rodgers — Forward Deployed Engineer">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0806"/>
      <stop offset="45%" stop-color="#15120E"/>
      <stop offset="100%" stop-color="#1D1913"/>
    </linearGradient>
    <linearGradient id="og-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A96E"/>
      <stop offset="100%" stop-color="#E8D5A8"/>
    </linearGradient>
    <filter id="og-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)"/>

  <!-- Large ghost name in background -->
  <text x="600" y="420" text-anchor="middle" fill="#C8A96E" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="400" opacity="0.04" letter-spacing="-6">RODGERS</text>

  <!-- Top accent -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#C8A96E" stroke-width="1" opacity="0.3"/>

  <!-- Main name -->
  <text x="80" y="260" fill="#F4F1EA" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="400" letter-spacing="-2">MIKE RODGERS</text>

  <!-- Slash subtitle -->
  <text x="85" y="318" fill="#C8A96E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="2">/  Forward Deployed Engineer</text>

  <!-- Floating track-record stats -->
  <g transform="translate(80, 420)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="300" height="120" rx="6" fill="#C8A96E" opacity="0.06" stroke="#C8A96E" stroke-width="1"/>
    <text x="24" y="55" fill="#F4F1EA" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400">$32B</text>
    <text x="24" y="85" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1">VALUE DEPLOYED</text>

    <!-- Stat 2 -->
    <rect x="340" y="0" width="300" height="120" rx="6" fill="#C8A96E" opacity="0.06" stroke="#C8A96E" stroke-width="1"/>
    <text x="364" y="55" fill="#F4F1EA" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400">130+</text>
    <text x="364" y="85" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1">AGENTS SHIPPED</text>

    <!-- Stat 3 -->
    <rect x="680" y="0" width="300" height="120" rx="6" fill="#C8A96E" opacity="0.06" stroke="#C8A96E" stroke-width="1"/>
    <text x="704" y="55" fill="#F4F1EA" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="400">3hr→15min</text>
    <text x="704" y="85" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1">CYCLE TIME COMPRESSION</text>
  </g>

  <!-- URL -->
  <text x="1120" y="580" text-anchor="end" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="16" letter-spacing="1">rodgersintelligence.com</text>

  <!-- Corner tag -->
  <text x="1120" y="115" text-anchor="end" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="12" opacity="0.5">Forward Deployed • Proof-First • Agent-Native</text>
</svg>